name: Wii Joy-Con Bridge

on:
  push:
    paths:
      - 'wii-joycon-bridge/**'
      - '.github/workflows/wii-joycon-bridge.yml'
  pull_request:
    paths:
      - 'wii-joycon-bridge/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build boot.dol
        working-directory: wii-joycon-bridge
        run: make dist

      - name: Upload SD card folder
        uses: actions/upload-artifact@v4
        with:
          name: joycon-bridge-sd
          path: wii-joycon-bridge/dist/
